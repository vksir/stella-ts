<!doctype html>
<html lang="zh-CN" data-theme="light">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Stella</title>
		<meta name="theme-color" content="#ffffff" />
		<link
			rel="icon"
			href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234176e6'/%3E%3Cpath d='M16 6l2.4 7.6L26 16l-7.6 2.4L16 26l-2.4-7.6L6 16l7.6-2.4z' fill='white'/%3E%3C/svg%3E"
		/>
		<link rel="stylesheet" href="/src/style.css" />
		<script>
			// 主题防闪：head 解析期即按偏好（stella-theme：light|dark|system，默认 system）
			// 设定 html[data-theme] 与 color-scheme / theme-color，避免深色用户首帧见白。
			// main.ts 的 applyTheme 使用同一套键与落点。
			(function () {
				try {
					var pref = localStorage.getItem("stella-theme") || "system";
					var dark =
						pref === "dark" ||
						(pref !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
					var root = document.documentElement;
					root.dataset.theme = dark ? "dark" : "light";
					root.style.colorScheme = dark ? "dark" : "light";
					var meta = document.querySelector('meta[name="theme-color"]');
					if (meta) meta.content = dark ? "#151517" : "#ffffff";
				} catch (e) {
					/* localStorage 不可用时保持默认亮色 */
				}
			})();
		</script>
	</head>
	<body>
		<!-- 应用外壳（DSH AppFrame）：grid 两列，侧栏 280px ↔ 56px rail，<768px 侧栏变抽屉 -->
		<div id="frame" class="frame">
			<!-- 侧栏列（DSH sidebarCol / SidebarRoot） -->
			<aside id="sidebar" class="sidebar-col">
				<div class="sidebar-root">
					<!-- 品牌行：wordmark + 收起按钮（DSH logoRow + panel toggle） -->
					<div class="logo-row">
						<button id="brand" class="brand" type="button" title="Stella">
							<span class="brand-identity">
								<span class="brand-mark" aria-hidden="true">
									<svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true">
										<path d="M12 2.6l2.5 6.6 6.9 2.8-6.9 2.8L12 21.4l-2.5-6.6-6.9-2.8 6.9-2.8z" />
									</svg>
								</span>
								<span class="brand-name">Stella</span>
							</span>
							<!-- rail 态 hover 显示的展开图标（DSH rail logo swap） -->
							<span class="rail-expand" aria-hidden="true">
								<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
									<rect x="3" y="4" width="18" height="16" rx="3" />
									<path d="M9.5 4v16M14.5 10l2 2-2 2" />
								</svg>
							</span>
						</button>
						<button id="sidebar-collapse" class="icon-btn" type="button" aria-label="收起侧栏">
							<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
								<rect x="3" y="4" width="18" height="16" rx="3" />
								<path d="M9.5 4v16M15.5 10l-2 2 2 2" />
							</svg>
						</button>
					</div>
					<!-- 新会话：38px 条（DSH newSession，12px 圆角 + 发丝线描边） -->
					<button id="new-conversation" class="new-session" type="button">
						<span class="new-session-content">
							<svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
								<path d="M8 3v10M3 8h10" />
							</svg>
							<span class="new-session-label">新会话</span>
						</span>
					</button>
					<!-- 会话列表（DSH scrollRegion：行高 32px、radius-md、hover/选中填充） -->
					<div class="scroll-region">
						<ul id="conversation-list" class="session-list"></ul>
					</div>
					<!-- 底部：连接状态 + 主题（DSH footArea 的 iconButton 几何） -->
					<div class="foot-area">
						<span id="conn" class="conn conn-offline" title="未连接"><span class="conn-dot" aria-hidden="true"></span><span class="conn-text">未连接</span></span>
						<button id="theme-toggle" class="icon-btn" type="button" data-pref="system" title="主题：跟随系统" aria-label="主题：跟随系统，点击切换">
							<svg class="icon-light" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
								<circle cx="12" cy="12" r="4" />
								<path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
							</svg>
							<svg class="icon-dark" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
								<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z" />
							</svg>
							<svg class="icon-system" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
								<rect x="2" y="4" width="20" height="13" rx="2" />
								<path d="M8 21h8m-4-4v4" />
							</svg>
						</button>
					</div>
				</div>
			</aside>
			<!-- 抽屉遮罩（<768px） -->
			<div id="drawer-mask" class="drawer-mask" hidden></div>
			<!-- 中央列（DSH centerCol / ConversationRoot） -->
			<section id="center" class="center-col">
				<!-- 会话头部（DSH header：面包屑行 + 发丝线下缘；空白态隐藏） -->
				<header id="chat-header" class="conv-header" hidden>
					<div class="title-row">
						<button id="menu-toggle" class="icon-btn mobile-only" type="button" aria-label="打开会话列表" aria-expanded="false" aria-controls="sidebar">
							<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
								<path d="M4 6h16M4 12h16M4 18h16" />
							</svg>
						</button>
						<button id="sidebar-open" class="icon-btn desktop-only" type="button" aria-label="展开侧栏" hidden>
							<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
								<rect x="3" y="4" width="18" height="16" rx="3" />
								<path d="M9.5 4v16M14.5 10l2 2-2 2" />
							</svg>
						</button>
						<div class="crumbs">
							<span class="crumb-seg">
								<span id="chat-title" class="crumb crumb-current">新对话</span>
							</span>
						</div>
					</div>
				</header>
				<!-- 滚动主体：转录 + sticky composer（DSH scrollBody / composerSeat） -->
				<div id="scroll-body" class="scroll-body">
					<main id="messages" class="messages" aria-live="polite"></main>
					<!-- 空会话 hero（DSH HeroShell）：星标 + 标题居中，composer 由 main.ts 挪入 -->
					<div id="hero" class="hero" hidden>
						<div class="hero-stack">
							<div class="hero-headline">
								<span class="hero-mark" aria-hidden="true">
									<svg viewBox="0 0 24 24" width="26" height="26" fill="currentColor" aria-hidden="true">
										<path d="M12 2.6l2.5 6.6 6.9 2.8-6.9 2.8L12 21.4l-2.5-6.6-6.9-2.8 6.9-2.8z" />
									</svg>
								</span>
								<span class="hero-title">Stella</span>
							</div>
							<div class="hero-sub">万用日常型助手，直接开始提问。</div>
						</div>
					</div>
					<!-- composer seat：sticky 置底 + 顶部 36px 渐变遮罩（DSH composerSeat） -->
					<div id="composer-seat" class="composer-seat">
						<footer id="composer" class="input-bar">
							<div class="input-scroll">
								<div class="grow">
									<textarea
										id="input"
										rows="1"
										aria-label="消息输入框"
										placeholder="给 Stella 发消息…（Enter 发送，Shift+Enter 换行）"
									></textarea>
								</div>
							</div>
							<!-- 工具行（DSH InputBar .row）：左 workspace chip；右 收藏 + 模型 chip + 停止/发送 -->
							<div class="row">
								<div class="tools">
									<div class="ws-anchor">
										<button id="workspace-chip" class="chip ws-chip" type="button" aria-expanded="false" aria-haspopup="dialog" title="工作目录">
											<svg class="ws-folder" viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
												<path d="M1.5 4.5A1.5 1.5 0 0 1 3 3h3l1.5 1.5H13A1.5 1.5 0 0 1 14.5 6v5A1.5 1.5 0 0 1 13 12.5H3A1.5 1.5 0 0 1 1.5 11z" />
											</svg>
											<span id="workspace-label" class="ws-label">工作目录</span>
											<svg class="chevron" viewBox="0 0 12 12" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
												<path d="M3 4.5L6 7.5L9 4.5" />
											</svg>
										</button>
										<!-- 工作目录弹层：向上弹出（DSH overlayAnchor 方向），44px 输入 + 两按钮 -->
										<div id="workspace-pop" class="ws-pop" hidden>
											<div class="ws-pop-title">工作目录</div>
											<input
												id="workspace-dir"
												class="ws-input"
												type="text"
												spellcheck="false"
												autocomplete="off"
												placeholder="绝对路径，如 D:\projects\demo"
											/>
											<div id="workspace-hint" class="ws-hint"></div>
											<div class="ws-actions">
												<button id="reset-workspace" class="btn btn-sm btn-ghost" type="button">恢复默认</button>
												<button id="save-workspace" class="btn btn-sm btn-primary" type="button">保存</button>
											</div>
										</div>
									</div>
								</div>
								<div class="trailing">
									<button id="toggle-favorite" class="icon-btn fav-btn" type="button" title="收藏当前模型" aria-label="收藏当前模型">☆</button>
									<select id="model-select" class="select" aria-label="当前会话使用的模型"></select>
									<button id="stop" class="send-btn stop" type="button" hidden aria-label="停止生成">
										<svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true">
											<rect x="3" y="3" width="10" height="10" rx="2.5" fill="currentColor" />
										</svg>
									</button>
									<button id="send" class="send-btn" type="button" aria-label="发送">
										<svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
											<path d="M10 16V4M4.5 9.5 10 4l5.5 5.5" />
										</svg>
									</button>
								</div>
							</div>
						</footer>
					</div>
				</div>
			</section>
		</div>
		<!-- 删除确认（DSH Modal：mask + 28px 圆角卡 + prominent 阴影） -->
		<div id="confirm" class="modal-root" hidden>
			<div class="modal-mask"></div>
			<div id="confirm-card" class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="confirm-title">
				<div class="modal-header">
					<h3 id="confirm-title" class="modal-title">删除会话</h3>
				</div>
				<p id="confirm-text" class="modal-desc"></p>
				<div class="modal-footer">
					<button id="confirm-cancel" class="btn btn-md btn-ghost" type="button">取消</button>
					<button id="confirm-delete" class="btn btn-md btn-danger" type="button">删除</button>
				</div>
			</div>
		</div>
		<!-- 全局提示（DSH Toast：顶部居中深色胶囊） -->
		<div id="banner" class="toast" hidden></div>
		<script type="module" src="/src/main.ts"></script>
	</body>
</html>
