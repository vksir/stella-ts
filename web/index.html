<!doctype html>
<html lang="zh-CN" data-theme="light">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Stella</title>
		<meta
			name="theme-color"
			content="#ffffff"
		/>
		<link
			rel="icon"
			href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234176e6'/%3E%3Cpath d='M16 6l2.4 7.6L26 16l-7.6 2.4L16 26l-2.4-7.6L6 16l7.6-2.4z' fill='white'/%3E%3C/svg%3E"
		/>
		<link rel="stylesheet" href="/src/style.css" />
		<script>
			// 主题防闪：解析到 head 时立即按偏好（stella-theme：light|dark|system，默认 system）
			// 设定 html[data-theme] 与 color-scheme / theme-color，避免深色用户首帧见白。
			(function () {
				try {
					var pref = localStorage.getItem("stella-theme") || "system";
					var dark =
						pref === "dark" ||
						(pref !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
					var root = document.documentElement;
					root.dataset.theme = dark ? "dark" : "light";
					root.style.colorScheme = dark ? "dark" : "light";
					var meta = document.querySelector('meta[name="theme-color"]');
					if (meta) meta.content = dark ? "#151517" : "#ffffff";
				} catch (e) {
					/* localStorage 不可用时保持默认亮色 */
				}
			})();
		</script>
	</head>
	<body>
		<div id="app">
			<!-- 移动端顶栏（<768px 显示）：抽屉开关 + 标题 -->
			<header id="mobilebar">
				<button
					id="menu-toggle"
					type="button"
					aria-label="打开会话列表"
					aria-expanded="false"
					aria-controls="sidebar"
				>
					<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
						<path d="M4 6h16M4 12h16M4 18h16" />
					</svg>
				</button>
				<span class="mobilebar-title">Stella</span>
			</header>
			<div id="layout">
				<aside id="sidebar">
					<div class="brand-row">
						<span class="brand-mark" aria-hidden="true">✦</span>
						<span class="brand-name">Stella</span>
						<span class="brand-sub">万用日常型助手</span>
					</div>
					<button id="new-conversation" type="button">＋ 新会话</button>
					<ul id="conversation-list"></ul>
					<div id="conversation-settings">
						<div class="settings-title">会话设置</div>
						<label id="model-label" for="model-select">模型</label>
						<div id="model-row">
							<select id="model-select" aria-label="当前会话使用的模型"></select>
							<button id="toggle-favorite" type="button" title="收藏当前模型">☆</button>
						</div>
						<div id="model-hint"></div>
						<label id="workspace-label" for="workspace-dir">工作目录</label>
						<input
							id="workspace-dir"
							type="text"
							spellcheck="false"
							autocomplete="off"
							placeholder="绝对路径，如 D:\projects\demo"
						/>
						<div id="workspace-hint"></div>
						<div id="workspace-actions">
							<button id="save-workspace" type="button">保存</button>
							<button id="reset-workspace" type="button">恢复默认</button>
						</div>
					</div>
					<div id="sidebar-foot">
						<span id="conn" class="conn conn-offline" title="未连接">未连接</span>
						<button
							id="theme-toggle"
							type="button"
							data-pref="system"
							title="主题：跟随系统"
							aria-label="主题：跟随系统，点击切换"
						>
							<svg class="icon-light" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
								<circle cx="12" cy="12" r="4" />
								<path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
							</svg>
							<svg class="icon-dark" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
								<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z" />
							</svg>
							<svg class="icon-system" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
								<rect x="2" y="4" width="20" height="13" rx="2" />
								<path d="M8 21h8m-4-4v4" />
							</svg>
						</button>
					</div>
				</aside>
				<div id="drawer-mask" hidden></div>
				<section id="chat">
					<main id="messages" aria-live="polite"></main>
					<div id="banner" hidden></div>
					<footer id="composer">
						<textarea
							id="input"
							rows="1"
							aria-label="消息输入框"
							placeholder="给 Stella 发消息…（Enter 发送，Shift+Enter 换行）"
						></textarea>
						<div class="composer-row">
							<button id="stop" type="button" hidden aria-label="停止生成">
								<svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
									<rect x="3" y="3" width="10" height="10" rx="3" fill="currentColor" />
								</svg>
							</button>
							<button id="send" type="button" aria-label="发送">
								<svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
									<path d="M10 16V4M4.5 9.5 10 4l5.5 5.5" />
								</svg>
							</button>
						</div>
					</footer>
				</section>
			</div>
		</div>
		<!-- 删除确认弹层 -->
		<div id="confirm" hidden>
			<div id="confirm-card" role="dialog" aria-modal="true" aria-labelledby="confirm-text">
				<p id="confirm-text"></p>
				<div id="confirm-actions">
					<button id="confirm-cancel" type="button">取消</button>
					<button id="confirm-delete" type="button">删除</button>
				</div>
			</div>
		</div>
		<script type="module" src="/src/main.ts"></script>
	</body>
</html>
