<!doctype html>
<html lang="zh-CN">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Stella</title>
		<meta name="theme-color" content="#ffffff" />
		<link
			rel="icon"
			href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232563eb'/%3E%3Cpath d='M16 6l2.4 7.6L26 16l-7.6 2.4L16 26l-2.4-7.6L6 16l7.6-2.4z' fill='white'/%3E%3C/svg%3E"
		/>
		<link rel="stylesheet" href="/src/style.css" />
	</head>
	<body>
		<div id="app">
			<header id="topbar">
				<span class="brand">Stella</span>
				<span class="sub">万用日常型助手</span>
				<span id="conn" class="conn conn-offline" title="未连接">未连接</span>
			</header>
			<div id="layout">
				<aside id="sidebar">
					<button id="new-conversation" type="button">＋ 新会话</button>
					<ul id="conversation-list"></ul>
					<div id="conversation-settings">
						<div class="settings-title">会话设置</div>
						<label id="model-label" for="model-select">模型</label>
						<div id="model-row">
							<select id="model-select" aria-label="当前会话使用的模型"></select>
							<button id="toggle-favorite" type="button" title="收藏当前模型">☆</button>
						</div>
						<div id="model-hint"></div>
						<label id="workspace-label" for="workspace-dir">工作目录</label>
						<input
							id="workspace-dir"
							type="text"
							spellcheck="false"
							autocomplete="off"
							placeholder="绝对路径，如 D:\projects\demo"
						/>
						<div id="workspace-hint"></div>
						<div id="workspace-actions">
							<button id="save-workspace" type="button">保存</button>
							<button id="reset-workspace" type="button">恢复默认</button>
						</div>
					</div>
				</aside>
				<section id="chat">
					<main id="messages" aria-live="polite"></main>
					<div id="banner" hidden></div>
					<footer id="composer">
						<textarea
							id="input"
							rows="2"
							aria-label="消息输入框"
							placeholder="给 Stella 发消息…（Enter 发送，Shift+Enter 换行）"
						></textarea>
						<button id="stop" type="button" hidden>停止</button>
						<button id="send" type="button">发送</button>
					</footer>
				</section>
			</div>
		</div>
		<!-- 删除确认弹层 -->
		<div id="confirm" hidden>
			<div id="confirm-card" role="dialog" aria-modal="true" aria-labelledby="confirm-text">
				<p id="confirm-text"></p>
				<div id="confirm-actions">
					<button id="confirm-cancel" type="button">取消</button>
					<button id="confirm-delete" type="button">删除</button>
				</div>
			</div>
		</div>
		<script type="module" src="/src/main.ts"></script>
	</body>
</html>
