<!doctype html>
<html lang="zh-CN" data-theme="light">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Stella · 日常智能体</title>
		<meta name="description" content="Stella：万用日常型 Web Agent。对话、读写文件、运行命令。" />
		<meta name="theme-color" content="#fbfaf7" />
		<link
			rel="icon"
			href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23fbfaf7'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%2324221e' stroke-width='1.4'/%3E%3Cpath d='M16 10.4l1.6 4 4 1.6-4 1.6-1.6 4-1.6-4-4-1.6 4-1.6z' fill='%233d5447'/%3E%3C/svg%3E"
		/>
		<link rel="stylesheet" href="/src/style.css" />
		<script>
			// 主题防闪：head 解析期即按偏好（stella-theme：light|dark|system，默认 system）
			// 设定 html[data-theme] 与 color-scheme / theme-color，避免深色用户首帧见白。
			// theme.ts 的 applyTheme 使用同一套键与落点。
			(function () {
				try {
					var pref = localStorage.getItem("stella-theme") || "system";
					var dark =
						pref === "dark" ||
						(pref !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
					var root = document.documentElement;
					root.dataset.theme = dark ? "dark" : "light";
					root.style.colorScheme = dark ? "dark" : "light";
					var meta = document.querySelector('meta[name="theme-color"]');
					if (meta) meta.content = dark ? "#1c1a17" : "#fbfaf7";
				} catch (e) {
					/* localStorage 不可用时保持默认亮色 */
				}
			})();
		</script>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
